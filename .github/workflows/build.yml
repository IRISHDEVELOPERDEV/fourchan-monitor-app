name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold Android project
        run: flutter create --org com.chris.fourchanmonitor --platforms=android --project-name fourchan_monitor .

      - name: Overlay app source
        run: |
          cp -f app_src/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r app_src/lib lib
          cp -f app_src/icon.png icon.png
          cp -f app_src/google-services.json android/app/google-services.json
          rm -f test/widget_test.dart

      - name: Add INTERNET + notifications permission, allow cleartext HTTP
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application',
                            '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('<application',
                            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application',
                            '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="fourchan_monitor"', 'android:label="X4chan"')
          open(p, 'w').write(s)
          print(s)
          PY

      - name: Enable Firebase (google-services Gradle plugin)
        run: |
          python3 - <<'PY'
          import os, re
          def inject(path, line, marker='com.google.gms.google-services'):
              if not os.path.exists(path):
                  return False
              s = open(path).read()
              if marker in s:
                  return True
              m = re.search(r'plugins\s*\{', s)
              if not m:
                  return False
              close = s.find('}', m.end())   # insert at END of plugins block (order matters)
              if close == -1:
                  return False
              s = s[:close] + '    ' + line + '\n' + s[close:]
              open(path, 'w').write(s)
              print('patched', path)
              return True
          # settings file: declare the plugin (apply false); app file: apply it.
          if os.path.exists('android/settings.gradle.kts'):
              inject('android/settings.gradle.kts',
                     'id("com.google.gms.google-services") version "4.4.2" apply false')
          else:
              inject('android/settings.gradle',
                     'id "com.google.gms.google-services" version "4.4.2" apply false')
          if os.path.exists('android/app/build.gradle.kts'):
              inject('android/app/build.gradle.kts', 'id("com.google.gms.google-services")')
          else:
              inject('android/app/build.gradle', 'id "com.google.gms.google-services"')
          PY
          echo "--- settings ---"; cat android/settings.gradle.kts android/settings.gradle 2>/dev/null | grep -n google-services || true
          echo "--- app ---"; cat android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | grep -n google-services || true

      - name: Force minSdk 23
        run: |
          f=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -1)
          echo "gradle file: $f"
          sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*[A-Za-z0-9_.]+/minSdk = 23/' "$f"
          grep -n "minSdk" "$f" || true

      - name: Build APK
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk fourchan-monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fourchan-monitor-apk
          path: fourchan-monitor.apk
          if-no-files-found: error

      # Recreate the "latest" release each build so its DATE is always current
      # (reusing a release keeps its old date, which looks stale). Same download URL:
      # https://github.com/IRISHDEVELOPERDEV/fourchan-monitor-app/releases/download/latest/fourchan-monitor.apk
      - name: Publish latest APK release (fresh date each build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --cleanup-tag -y || true
          sleep 3
          gh release create latest fourchan-monitor.apk \
            --repo "${{ github.repository }}" \
            --title "X4chan APK — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes "Auto-built $(date -u '+%Y-%m-%d %H:%M UTC') from commit ${{ github.sha }}. Install this APK — works out of the box."

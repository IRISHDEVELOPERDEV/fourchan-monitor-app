name: build-apk

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older build of the same branch/PR.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the APK is kept as a private workflow artifact, nothing is
# published or pushed back to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_src   # the Flutter project (android/ is committed)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'   # pinned: bump deliberately, together with pubspec.lock
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app_src/pubspec.lock', 'app_src/android/**/*.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Set up release signing (keystore from repo secrets)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 secret is not set"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK (signed, build number = run number)
        env:
          MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
        run: |
          if [ -z "$MONITOR_API_TOKEN" ]; then
            echo "MONITOR_API_TOKEN secret is not set"; exit 1
          fi
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=MONITOR_API_TOKEN="$MONITOR_API_TOKEN"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/X4chan.apk"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      # Keep the APK as a private workflow artifact (it contains the API token),
      # instead of publishing it as a public release.
      - name: Upload APK as private artifact
        uses: actions/upload-artifact@v4
        with:
          name: X4chan-apk
          path: X4chan.apk
          retention-days: 7

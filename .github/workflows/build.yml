name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold Android project
        run: flutter create --org com.chris.fourchanmonitor --platforms=android --project-name fourchan_monitor .

      - name: Overlay app source
        run: |
          cp -f app_src/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r app_src/lib lib
          cp -f app_src/icon.png icon.png
          rm -f test/widget_test.dart

      - name: Add INTERNET permission + allow cleartext HTTP
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application',
                            '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application',
                            '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="fourchan_monitor"', 'android:label="X4chan"')
          open(p, 'w').write(s)
          print(s)
          PY

      - name: Force minSdk 23
        run: |
          f=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -1)
          echo "gradle file: $f"
          sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*[A-Za-z0-9_.]+/minSdk = 23/' "$f"
          grep -n "minSdk" "$f" || true

      - name: Build APK
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk fourchan-monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fourchan-monitor-apk
          path: fourchan-monitor.apk
          if-no-files-found: error

      # Publish/refresh a stable "latest" release so the download URL never changes:
      # https://github.com/IRISHDEVELOPERDEV/fourchan-monitor-app/releases/download/latest/fourchan-monitor.apk
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK (auto-built)
          files: fourchan-monitor.apk
          body: "Auto-built from the latest commit. Install this APK; it works out of the box for testing."
